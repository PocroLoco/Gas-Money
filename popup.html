<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gas Money</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="brand">
      <svg class="brand-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M3 2.5A1.5 1.5 0 0 1 4.5 1h4A1.5 1.5 0 0 1 10 2.5V8h.5A1.5 1.5 0 0 1 12 9.5v2a.5.5 0 0 0 1 0V6.2l-1.35-1.35a.5.5 0 1 1 .7-.7l1.5 1.5a.5.5 0 0 1 .15.35v5.5a1.5 1.5 0 0 1-3 0v-2a.5.5 0 0 0-.5-.5H10v4.5h.5a.5.5 0 0 1 0 1h-8a.5.5 0 0 1 0-1H3zm1.5 0v3.5h4V2.5z"/></svg>
      <h1>Gas Money</h1>
    </header>

    <section class="sign" aria-live="polite">
      <div class="sign-inner">
        <label class="sign-distance">
          <input id="miles" type="number" inputmode="decimal" min="0" step="0.1" value="10" aria-label="Miles away">
          <span>miles away</span>
        </label>
        <p class="sign-cost" id="cost">$–.––</p>
        <p class="sign-note" id="costNote">Add your MPG and gas price below</p>
      </div>
    </section>

    <section class="fields">
      <div class="row">
        <label for="mpg">Your MPG</label>
        <div class="field">
          <input id="mpg" type="number" inputmode="decimal" min="1" step="0.1" placeholder="30">
          <span class="unit">mpg</span>
        </div>
        <p class="hint">Check your dash or <a href="https://www.fueleconomy.gov/feg/findacar.shtml" target="_blank" rel="noopener">fueleconomy.gov</a>.</p>
      </div>

      <div class="row">
        <label for="price">Gas price</label>
        <div class="field">
          <span class="unit unit-lead">$</span>
          <input id="price" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="3.50">
          <span class="unit">/gal</span>
        </div>
        <p class="hint" id="priceHint">What a gallon costs near you. <a href="https://gasprices.aaa.com/" target="_blank" rel="noopener">Check local average</a></p>
      </div>

      <div class="row row-toggle">
        <label for="round">Round trip</label>
        <input id="round" type="checkbox" class="switch" role="switch">
        <p class="hint">Doubles the distance for the drive back.</p>
      </div>
    </section>

    <footer class="status" id="status" data-tone="idle">
      <span class="dot" aria-hidden="true"></span>
      <span id="statusText">Checking this tab…</span>
    </footer>
  </main>

  <script src="gas.js"></script>
  <script src="popup.js"></script>
</body>
</html>
