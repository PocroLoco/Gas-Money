<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gas Money settings</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="panel" role="dialog" aria-label="Gas Money settings">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M3 2.5A1.5 1.5 0 0 1 4.5 1h4A1.5 1.5 0 0 1 10 2.5V8h.5A1.5 1.5 0 0 1 12 9.5v2a.5.5 0 0 0 1 0V6.2l-1.35-1.35a.5.5 0 1 1 .7-.7l1.5 1.5a.5.5 0 0 1 .15.35v5.5a1.5 1.5 0 0 1-3 0v-2a.5.5 0 0 0-.5-.5H10v4.5h.5a.5.5 0 0 1 0 1h-8a.5.5 0 0 1 0-1H3zm1.5 0v3.5h4V2.5z"/></svg><span>Gas Money</span></div>
    <button class="x" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="sign"><p class="msg"></p></div>
  <div class="row">
    <label for="mpg">Your MPG</label>
    <div class="field"><input id="mpg" type="number" inputmode="decimal" min="1" step="0.1" placeholder="30"><span class="unit">mpg</span></div>
    <p class="hint">Check your dash or <a href="https://www.fueleconomy.gov/feg/findacar.shtml" target="_blank" rel="noopener">fueleconomy.gov</a>.</p>
  </div>
  <div class="row">
    <label for="price">Gas price</label>
    <div class="field"><span class="unit">$</span><input id="price" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="3.50"><span class="unit">/gal</span></div>
    <p class="hint price-hint"></p>
  </div>
  <div class="row">
    <label for="round">Round trip</label>
    <input id="round" class="switch" type="checkbox" role="switch">
    <p class="hint">Doubles the distance for the drive back.</p>
  </div>
  <button class="done" type="button">Done</button>
</div>
<script src="gas.js"></script>
<script src="panel-frame.js"></script>
</body>
</html>
